name: taskflow
description: TaskFlow mobile app. Talks to the same Node backend as the website.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.5.0
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2                    # REST calls
  provider: ^6.1.2                # app-wide state (auth, API client)
  flutter_secure_storage: ^9.2.2  # token in Android Keystore / iOS Keychain
  google_fonts: ^6.2.1            # Plus Jakarta Sans, same as the website

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.jpg
